name: Code Quality Checks

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8 pylint mypy pytest pytest-cov
      
      - name: Format check with Black
        run: black --check src/ tests/
        continue-on-error: false
      
      - name: Import sorting check with isort
        run: isort --check-only src/ tests/
        continue-on-error: false
      
      - name: Lint with Flake8
        run: flake8 src/ tests/ --max-line-length=100 --count --statistics
        continue-on-error: false
      
      - name: Type check with Mypy
        run: mypy src/ --strict --ignore-missing-imports
        continue-on-error: false
      
      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing
        continue-on-error: false
      
      - name: Generate coverage report
        run: pytest tests/ --cov=src --cov-report=xml
        if: always()
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        if: always()

  summary:
    name: Quality Check Summary
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    if: always()
    
    steps:
      - name: Check quality status
        run: |
          if [ "${{ needs.lint-and-type-check.result }}" == "success" ]; then
            echo "✅ All quality checks passed!"
            exit 0
          else
            echo "❌ Quality checks failed!"
            exit 1
          fi
